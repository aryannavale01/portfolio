    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Raw Data Source</text>
  </g>

  <!-- NODE 2: Ingestion -->
  <g transform="translate(230, 100)">
