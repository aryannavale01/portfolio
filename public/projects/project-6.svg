  <circle cx="50" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="64" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="86" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">PROJECT 06 // PIPELINE PLACEHOLDER</text>
  <text x="760" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FF6B63" letter-spacing="1">STATUS: TBD</text>

