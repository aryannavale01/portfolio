    <rect width="150" height="100" rx="10" fill="rgba(40,16,18,0.92)" stroke="#FF6B63" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="18" rx="4" fill="rgba(255,107,99,0.18)" stroke="#FF6B63" stroke-width="0.8"/>
