  <path d="M 165 285 L 165 350 L 575 350" fill="none" stroke="#FF6B63" stroke-width="1.5" marker-end="url(#arrow-red-6)"/>

  <!-- NODE 1: Input -->
  <g transform="translate(35, 100)">
