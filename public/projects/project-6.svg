    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Main Engine</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.6)">Algorithm Layer</text>
    <text x="12" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#FF6B63">Edit This Node</text>
