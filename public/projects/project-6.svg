  <path d="M 165 145 L 225 145" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-white-6)"/>
  <path d="M 365 145 L 425 145" fill="none" stroke="#FF6B63" stroke-width="1.5" marker-end="url(#arrow-red-6)"/>
  <path d="M 495 195 L 495 285 L 365 285" fill="none" stroke="#FF6B63" stroke-width="1.5" marker-end="url(#arrow-red-6)"/>
