<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="60%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <pattern id="grid-2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(255,255,255,0.4)"/>
    </marker>
    <filter id="glow-vault" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-2)"/>
  <rect width="800" height="450" fill="url(#grid-2)"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header Bar -->
  <path d="M 24 38 L 776 38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="36" cy="24" r="4" fill="#38BDF8"/>
  <circle cx="50" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="64" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="86" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">SIMPLEX VAULT // ZERO-METADATA ARCHITECTURE</text>
  <text x="760" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#38BDF8" letter-spacing="1">ISOLATION: ENFORCED</text>

  <!-- Connecting Lines -->
  <!-- 1 -> 2 -->
  <path d="M 165 145 L 225 145" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-white)"/>
  <!-- 2 -> 3 -->
  <path d="M 365 145 L 425 145" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 3 -> 4 (loop to bottom) -->
  <path d="M 495 195 L 495 285 L 365 285" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 4 -> 5 -->
  <path d="M 225 285 L 165 285" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 165 285 L 165 350 L 575 350" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- NODE 1: Notes UI Disguise -->
  <g transform="translate(35, 100)">
    <rect width="130" height="90" rx="8" fill="rgba(18,18,24,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <rect x="12" y="14" width="20" height="24" rx="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <line x1="16" y1="20" x2="26" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="16" y1="25" x2="28" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Notes Disguise</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Stealth Surface</text>
  </g>

  <!-- NODE 2: Biometric / Pattern Auth -->
  <g transform="translate(230, 100)">
    <rect width="135" height="90" rx="8" fill="rgba(18,18,24,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <rect x="14" y="16" width="18" height="18" rx="4" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="23" cy="25" r="3" fill="#38BDF8"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Biometric Gate</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Keystore Decrypt</text>
  </g>

  <!-- NODE 3: Additive Bridge (Core Highlight) -->
  <g transform="translate(430, 95)" filter="url(#glow-vault)">
    <rect width="150" height="100" rx="10" fill="rgba(12,24,36,0.92)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="68" height="18" rx="4" fill="rgba(56,189,248,0.2)" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#38BDF8">ADDITIVE LAYER</text>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Bridge Adapter</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.6)">Compose State Hook</text>
    <text x="12" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#38BDF8">Core Untouched</text>
  </g>

  <!-- NODE 4: SimpleX Core Chat Client -->
  <g transform="translate(230, 240)">
    <rect width="135" height="90" rx="8" fill="rgba(18,18,24,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <path d="M 14 18 L 30 18 L 30 30 L 22 30 L 17 34 L 17 30 L 14 30 Z" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">SimpleX Core</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Upstream Client</text>
  </g>

  <!-- NODE 5: Encrypted Peer Channel -->
  <g transform="translate(580, 305)">
    <rect width="175" height="90" rx="8" fill="rgba(18,18,24,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="22" cy="22" r="8" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="3" fill="#38BDF8"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">E2E Peer Tunnel</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Zero User ID / Relay</text>
  </g>

  <!-- Footer Meta -->
  <text x="35" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.35)">KOTLIN · JETPACK COMPOSE · SIMPLEX CHAT · ZERO METADATA</text>
</svg>
