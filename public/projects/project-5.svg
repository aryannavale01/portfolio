<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="60%" stop-color="#0e0a12"/>
      <stop offset="100%" stop-color="#060508"/>
    </linearGradient>
    <pattern id="grid-5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC"/>
    </marker>
    <marker id="arrow-white-5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(255,255,255,0.4)"/>
    </marker>
    <filter id="glow-avatar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-5)"/>
  <rect width="800" height="450" fill="url(#grid-5)"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header Bar -->
  <path d="M 24 38 L 776 38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="36" cy="24" r="4" fill="#C084FC"/>
  <circle cx="50" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="64" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="86" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">TALKTWIN // MULTILINGUAL AVATAR PIPELINE</text>
  <text x="760" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#C084FC" letter-spacing="1">TTS: 13 LANGUAGES</text>

  <!-- Connecting Lines -->
  <!-- 1 -> 2 -->
  <path d="M 165 145 L 225 145" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-white-5)"/>
  <!-- 2 -> 3 -->
  <path d="M 365 145 L 425 145" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- 3 -> 4 (loop to bottom) -->
  <path d="M 495 195 L 495 285 L 365 285" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- 4 -> 5 -->
  <path d="M 225 285 L 165 285" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 165 285 L 165 350 L 575 350" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- NODE 1: Audio Input Stream -->
  <g transform="translate(35, 100)">
    <rect width="130" height="90" rx="8" fill="rgba(22,18,26,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <!-- Mic icon -->
    <rect x="18" y="14" width="8" height="14" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <path d="M 14 22 C 14 27 20 29 22 29 C 24 29 30 27 30 22" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Audio Stream</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Raw PCM / WAV</text>
  </g>

  <!-- NODE 2: Voice Feature Extraction -->
  <g transform="translate(230, 100)">
    <rect width="135" height="90" rx="8" fill="rgba(22,18,26,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <!-- Waveform icon -->
    <path d="M 12 24 L 16 20 L 20 28 L 24 16 L 28 30 L 32 24" fill="none" stroke="#C084FC" stroke-width="1.3"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Feature Extract</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Timbre &amp; Formants</text>
  </g>

  <!-- NODE 3: Multilingual TTS (Core highlight) -->
  <g transform="translate(430, 95)" filter="url(#glow-avatar)">
    <rect width="150" height="100" rx="10" fill="rgba(30,16,40,0.92)" stroke="#C084FC" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="4" fill="rgba(192,132,252,0.2)" stroke="#C084FC" stroke-width="0.8"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#C084FC">TTS ENGINE</text>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">13-Lang Synthesis</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.6)">Voice Cloning Net</text>
    <text x="12" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#C084FC">Zero-shot Transfer</text>
  </g>

  <!-- NODE 4: Lip-Sync Viseme Mapping -->
  <g transform="translate(230, 240)">
    <rect width="135" height="90" rx="8" fill="rgba(22,18,26,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <path d="M 14 22 Q 22 30 30 22 Q 22 26 14 22 Z" fill="none" stroke="#C084FC" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Viseme Sync</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Phoneme Alignment</text>
  </g>

  <!-- NODE 5: Lip-sync Avatar Engine -->
  <g transform="translate(580, 305)">
    <rect width="175" height="90" rx="8" fill="rgba(22,18,26,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="22" cy="22" r="8" fill="rgba(192,132,252,0.15)" stroke="#C084FC" stroke-width="1.2"/>
    <circle cx="19" cy="20" r="1.5" fill="#C084FC"/>
    <circle cx="25" cy="20" r="1.5" fill="#C084FC"/>
    <path d="M 19 24 Q 22 27 25 24" fill="none" stroke="#C084FC" stroke-width="1"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Avatar Renderer</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Realtime WebGL Mesh</text>
  </g>

  <!-- Footer Meta -->
  <text x="35" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.35)">PYTHON · PYTORCH · FASTAPI · NEURAL TTS · WEBGL</text>
</svg>
