<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="60%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <pattern id="grid-4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-white-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(255,255,255,0.4)"/>
    </marker>
    <filter id="glow-ngo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-4)"/>
  <rect width="800" height="450" fill="url(#grid-4)"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header Bar -->
  <path d="M 24 38 L 776 38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="36" cy="24" r="4" fill="#818CF8"/>
  <circle cx="50" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="64" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="86" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">NGO ERP // FULL-STACK VERIFICATION PIPELINE</text>
  <text x="760" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#818CF8" letter-spacing="1">ROLE RBAC: ACTIVE</text>

  <!-- Connecting Lines -->
  <!-- 1 -> 2 -->
  <path d="M 165 145 L 225 145" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-white-4)"/>
  <!-- 2 -> 3 -->
  <path d="M 365 145 L 425 145" fill="none" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
  <!-- 3 -> 4 (loop to bottom) -->
  <path d="M 495 195 L 495 285 L 365 285" fill="none" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
  <!-- 4 -> 5 -->
  <path d="M 225 285 L 165 285" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 165 285 L 165 350 L 575 350" fill="none" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>

  <!-- NODE 1: Next.js 15 SSR Frontend -->
  <g transform="translate(35, 100)">
    <rect width="130" height="90" rx="8" fill="rgba(18,20,26,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <rect x="12" y="14" width="22" height="18" rx="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <line x1="12" y1="20" x2="34" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Next.js 15 UI</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">SSR / App Router</text>
  </g>

  <!-- NODE 2: Auth & Verification Middleware -->
  <g transform="translate(230, 100)">
    <rect width="135" height="90" rx="8" fill="rgba(18,20,26,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <path d="M 22 14 L 32 18 L 32 26 C 32 32 22 36 22 36 C 22 36 12 32 12 26 L 12 18 Z" fill="none" stroke="#818CF8" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Auth &amp; RBAC</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Doc Verification</text>
  </g>

  <!-- NODE 3: Prisma ORM (Core highlight) -->
  <g transform="translate(430, 95)" filter="url(#glow-ngo)">
    <rect width="150" height="100" rx="10" fill="rgba(20,22,40,0.92)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="18" rx="4" fill="rgba(129,140,248,0.2)" stroke="#818CF8" stroke-width="0.8"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#818CF8">DATA LAYER</text>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Prisma ORM</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.6)">Type-safe Client</text>
    <text x="12" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#818CF8">Supabase Postgres</text>
  </g>

  <!-- NODE 4: Supabase Storage & DB -->
  <g transform="translate(230, 240)">
    <rect width="135" height="90" rx="8" fill="rgba(18,20,26,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <ellipse cx="22" cy="18" rx="10" ry="4" fill="none" stroke="#818CF8" stroke-width="1.2"/>
    <path d="M 12 18 L 12 28 A 10 4 0 0 0 32 28 L 32 18" fill="none" stroke="#818CF8" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Supabase DB</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Blob Vault &amp; Audit</text>
  </g>

  <!-- NODE 5: Certificate Gen Pipeline -->
  <g transform="translate(580, 305)">
    <rect width="175" height="90" rx="8" fill="rgba(18,20,26,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="22" cy="22" r="8" fill="rgba(129,140,248,0.15)" stroke="#818CF8" stroke-width="1.2"/>
    <path d="M 18 22 L 21 25 L 26 19" fill="none" stroke="#818CF8" stroke-width="1.5"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Cert Gen Pipeline</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Cryptographic Hash</text>
  </g>

  <!-- Footer Meta -->
  <text x="35" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.35)">NEXT.JS 15 · PRISMA · SUPABASE · CRYPTOGRAPHIC SIGNING</text>
