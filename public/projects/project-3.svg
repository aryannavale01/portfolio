<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a08"/>
      <stop offset="60%" stop-color="#0a120b"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>
    <pattern id="grid-3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-white-3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(255,255,255,0.4)"/>
    </marker>
    <filter id="glow-fintech" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-3)"/>
  <rect width="800" height="450" fill="url(#grid-3)"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header Bar -->
  <path d="M 24 38 L 776 38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="36" cy="24" r="4" fill="#34D399"/>
  <circle cx="50" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="64" cy="24" r="4" fill="rgba(255,255,255,0.2)"/>
  <text x="86" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">TALLYWISE // LOCAL-FIRST EXPENSE PIPELINE</text>
  <text x="760" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#34D399" letter-spacing="1">PRIVACY: ON-DEVICE ONLY</text>

  <!-- Connecting Lines -->
  <!-- 1 -> 2 -->
  <path d="M 165 145 L 225 145" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-white-3)"/>
  <!-- 2 -> 3 -->
  <path d="M 365 145 L 425 145" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- 3 -> 4 (loop to bottom) -->
  <path d="M 495 195 L 495 285 L 365 285" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- 4 -> 5 -->
  <path d="M 225 285 L 165 285" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 165 285 L 165 350 L 575 350" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- NODE 1: Telephony SMS Listener -->
  <g transform="translate(35, 100)">
    <rect width="130" height="90" rx="8" fill="rgba(16,22,18,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <rect x="12" y="16" width="22" height="16" rx="3" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <path d="M 14 18 L 23 24 L 32 18" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">SMS Listener</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">BroadcastReceiver</text>
  </g>

  <!-- NODE 2: Regex / NLP Classifier -->
  <g transform="translate(230, 100)">
    <rect width="135" height="90" rx="8" fill="rgba(16,22,18,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <circle cx="20" cy="22" r="7" fill="none" stroke="#34D399" stroke-width="1.2"/>
    <path d="M 25 27 L 31 33" stroke="#34D399" stroke-width="1.5"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Regex / NLP Filter</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Amount &amp; Merchant</text>
  </g>

  <!-- NODE 3: Category Engine (Core highlight) -->
  <g transform="translate(430, 95)" filter="url(#glow-fintech)">
    <rect width="150" height="100" rx="10" fill="rgba(12,30,20,0.92)" stroke="#34D399" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="4" fill="rgba(52,211,153,0.2)" stroke="#34D399" stroke-width="0.8"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#34D399">CLASSIFIER</text>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Category Engine</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.6)">Auto Tagging</text>
    <text x="12" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#34D399">On-Device Heuristics</text>
  </g>

  <!-- NODE 4: Room Local DB -->
  <g transform="translate(230, 240)">
    <rect width="135" height="90" rx="8" fill="rgba(16,22,18,0.85)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <ellipse cx="22" cy="18" rx="10" ry="4" fill="none" stroke="#34D399" stroke-width="1.2"/>
    <path d="M 12 18 L 12 28 A 10 4 0 0 0 32 28 L 32 18" fill="none" stroke="#34D399" stroke-width="1.2"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Room Local DB</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">SQLite Entity Graph</text>
  </g>

  <!-- NODE 5: Monthly Budget Analytics -->
  <g transform="translate(580, 305)">
    <rect width="175" height="90" rx="8" fill="rgba(16,22,18,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="14" y="24" width="4" height="10" fill="#34D399"/>
    <rect x="21" y="18" width="4" height="16" fill="#34D399"/>
    <rect x="28" y="14" width="4" height="20" fill="#34D399"/>
    <text x="12" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F5F5">Budget Analytics</text>
    <text x="12" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)">Cashflow &amp; Trends</text>
  </g>

  <!-- Footer Meta -->
  <text x="35" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.35)">KOTLIN · ROOM DB · JETPACK ARCHITECTURE · LOCAL-FIRST</text>
</svg>
